services:
  - type: web
    name: habit-tracker
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt && flask db upgrade"
    startCommand: "gunicorn run:app"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: FLASK_APP
        value: run.py
      - key: DATABASE_URL
        fromDatabase:
          name: habit-tracker-db
          property: connectionString

databases:
  - name: habit-tracker-db
    plan: free
